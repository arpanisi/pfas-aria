name: CI

on:
  push:
    branches: [main, deploy]
    paths-ignore:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.png'
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports --follow-imports=skip --cache-dir=/dev/null --disable-error-code=import-untyped

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  # ── Stage 2: Security ────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit SAST
        run: bandit -r src/ -ll --exit-zero

      - name: pip-audit CVE scan
        run: pip-audit --requirement requirements.txt --progress-spinner off

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  # ── Stage 3: CodeQL ──────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── Stage 4: Tests ───────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check FastAPI app loads
        run: python -c "from src.api.main import app; print('FastAPI app loaded OK')"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
  
    # ── Stage 5: Frontend Build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── Stage 6: Frontend Security ───────────────────────────────────────────
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=critical
  
    # ── Stage 7: Docker Build + Smoke Test ──────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pfas-aria:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name pfas-aria-test \
            -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e AUTO_MIGRATE=false \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e MONGO_URL="mongodb://localhost:27017/?serverSelectionTimeoutMS=500" \
            -e REDIS_URL=redis://localhost:6379 \
            -e CLERK_SECRET_KEY=test \
            -e CLERK_PUBLISHABLE_KEY=test \
            -e OPENROUTER_API_KEY=test \
            pfas-aria:${{ github.sha }}

      - name: Wait for port 8000
        run: timeout 60 bash -c 'until nc -z localhost 8000; do sleep 1; done'

      - name: Smoke test /health
        run: |
          curl --fail http://localhost:8000/health || \
            (docker logs pfas-aria-test && exit 1)

      - name: Stop container
        if: always()
        run: docker stop pfas-aria-test && docker rm pfas-aria-test
