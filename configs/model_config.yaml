# ─────────────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# LLM and embedding settings.
# ─────────────────────────────────────────────────────────────────────────────

llm:
  # openrouter (default) | ollama | runpod
  provider: "openrouter"

  # OpenRouter model id — see https://openrouter.ai/models
  model: "openai/gpt-4o-mini"

  # RunPod: set provider to runpod and RUNPOD_ENDPOINT in .env
  runpod_endpoint: null

  # OpenRouter HTTP API (override only if needed)
  openrouter_base_url: "https://openrouter.ai/api/v1"
  openrouter_site_url: null
  openrouter_site_name: null

  temperature: 0.1
  max_tokens: 4096
  request_timeout: 120

embeddings:
  # Embedding model for RAG and similarity scoring
  model: "all-MiniLM-L6-v2"
  device: "cpu"

vector_store:
  provider: "mongodb"
  collection_name: "chunks"

mlflow:
  tracking_uri: "mlflow"
  experiment_name: "pfas-aria"
