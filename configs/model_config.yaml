# ─────────────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# LLM and embedding settings.
# ─────────────────────────────────────────────────────────────────────────────

llm:
  # openrouter (default) | ollama | runpod
  provider: "openrouter"

  # Reasoning model — for complex tasks: hypothesis generation, data analysis, grounding
  model: "openai/gpt-oss-120b:free"

  # Chat model — for short-form tasks: one-line rewrites, rationale summaries
  chat_model: "openai/gpt-oss-120b:free"

  # Tried in order when the primary model returns an error or times out
  fallback_models:
    - "meta-llama/llama-3.3-70b-instruct:free"
    - "nousresearch/hermes-3-llama-3.1-405b:free"
    - "openai/gpt-oss-120b:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "qwen/qwen3-next-80b-a3b-instruct:free"
    - "google/gemma-4-31b-it:free"
    - "minimax/minimax-m2.5:free"
    - "qwen/qwen3-coder:free"
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    - "nvidia/nemotron-3-nano-30b-a3b:free"
    - "google/gemma-4-26b-a4b-it:free"
    - "z-ai/glm-4.5-air:free"
    - "openai/gpt-oss-20b:free"
    - "deepseek/deepseek-v4-flash:free"
    - "inclusionai/ring-2.6-1t:free"
    - "arcee-ai/trinity-large-thinking:free"
    - "baidu/cobuddy:free"

  # RunPod: set provider to runpod and RUNPOD_ENDPOINT in .env
  runpod_endpoint: null

  # OpenRouter HTTP API (override only if needed)
  openrouter_base_url: "https://openrouter.ai/api/v1"
  openrouter_site_url: null
  openrouter_site_name: null

  temperature: 0.1
  max_tokens: 4096
  request_timeout: 120

embeddings:
  # Jina AI embedding model — API key from JINA_API_KEY env var
  model: "jina-embeddings-v3"

vector_store:
  provider: "mongodb"
  collection_name: "chunks"

mlflow:
  tracking_uri: "mlflow"
  experiment_name: "pfas-aria"
